[project]
name = "tonystark-voiceagent"
version = "0.1.0"
description = "F.R.I.D.A.Y. — a Tony Stark-style voice agent with its own HUD, built on LiveKit Agents and MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[mcp]>=1.5.1",
    "livekit-plugins-google>=1.5.1",
    "livekit-plugins-sarvam>=1.5.1",
    "livekit-plugins-silero>=1.5.1",
    "livekit-api",
    "mcp>=1.27",
    "httpx",
    "ddgs",
    "python-dotenv",
    "starlette",
    "uvicorn",
]

[project.scripts]
friday-server = "friday.server:main"
friday-voice = "friday.agent:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
